name: RepGen Reproduce Issue

# TEMPLATE — copy this file into YOUR project's `.github/workflows/` directory.
# It is meant to run in the repository whose issues you want reproduced, not in
# the RepGen repo itself.
#
# Label an issue with `needs-repro` and RepGen will generate a reproduction
# script for it and post the result back as a comment on that issue.
#
# Setup (one-time):
#   1. Create a repo secret with your LLM key, e.g. OPENAI_API_KEY
#      (or ANTHROPIC_API_KEY / GEMINI_API_KEY — see `env` below).
#   2. (Optional) Set repo variables REPGEN_BACKEND (default: openai) and
#      REPGEN_MODEL to pin a backend/model.
#   3. Create the `needs-repro` label, then apply it to an issue.
#
# The built-in GITHUB_TOKEN is used to read the issue and post the comment —
# no personal token required.

on:
  issues:
    types: [labeled]

permissions:
  contents: read      # checkout + time-travel the repo to the issue date
  issues: write       # post the reproduction back as an issue comment

# One reproduction per issue at a time; a newer label supersedes an older run.
concurrency:
  group: repgen-repro-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Generate reproduction
    if: github.event.label.name == 'needs-repro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so RepGen can time-travel to the bug date

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RepGen
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Acknowledge the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 **RepGen** picked up the \`needs-repro\` label and is generating a reproduction. Results will be posted here shortly." || true

      - name: Run RepGen
        id: repgen
        env:
          # Provide whichever key matches your chosen backend. Unused keys are
          # simply empty and ignored.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Used by RepGen to read the (possibly private) issue.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPGEN_BACKEND: ${{ vars.REPGEN_BACKEND || 'openai' }}
          REPGEN_MODEL: ${{ vars.REPGEN_MODEL }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set +e
          MODEL_ARG=""
          if [ -n "$REPGEN_MODEL" ]; then
            MODEL_ARG="--model $REPGEN_MODEL"
          fi
          # --yes: non-interactive. --no-execute keeps the Action fast and cheap
          # (static verification only); drop it to also run + verify in CI.
          repgen run --yes \
            --backend "$REPGEN_BACKEND" \
            $MODEL_ARG \
            --bug-report "$ISSUE_URL" \
            --repo . \
            --no-execute \
            --output "$GITHUB_WORKSPACE/repgen_results"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post the reproduction as a comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXIT_CODE: ${{ steps.repgen.outputs.exit_code }}
        run: |
          set -e
          REPORT="$(find "$GITHUB_WORKSPACE/repgen_results" -name report.md 2>/dev/null | sort | tail -n 1)"
          BODY_FILE="$(mktemp)"

          if [ "${EXIT_CODE:-1}" = "0" ]; then
            echo "### ✅ RepGen reproduction (static checks passed)" >> "$BODY_FILE"
          else
            echo "### ⚠️ RepGen reproduction (best effort)" >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo "Static verification did not fully pass — treat the script below as a starting point." >> "$BODY_FILE"
          fi
          echo "" >> "$BODY_FILE"

          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            # GitHub caps a comment at ~65k chars; keep well under it.
            head -c 60000 "$REPORT" >> "$BODY_FILE"
          else
            echo "RepGen did not produce a report — check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." >> "$BODY_FILE"
          fi
          echo "" >> "$BODY_FILE"
          echo "---" >> "$BODY_FILE"
          echo "_Generated by [RepGen](${{ github.server_url }}/${{ github.repository }}) · [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_" >> "$BODY_FILE"

          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body-file "$BODY_FILE"

          # Mirror the report into the job summary for quick viewing.
          cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repgen-results-issue-${{ github.event.issue.number }}
          path: repgen_results/
          if-no-files-found: ignore
