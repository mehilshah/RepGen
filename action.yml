name: "RepGen — reproduce issue"
description: >-
  Turn a labeled issue into a reproduction script and post it back as a comment.
author: "RepGen"
branding:
  icon: "target"
  color: "purple"

# Usage (in the consumer repo's own workflow):
#
#   - uses: actions/checkout@v4
#     with: { fetch-depth: 0 }   # full history so RepGen can time-travel
#   - uses: mehilshah/RepGen@v1
#     with:
#       backend: openai
#     env:
#       OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
#
# The LLM key is passed via `env:` on this step (pick the one matching `backend`:
# OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY);
# composite-action steps inherit it automatically.

inputs:
  backend:
    description: "LLM backend: openai | anthropic | gemini | openrouter."
    required: false
    default: "openai"
  model:
    description: "Model ID to pin. Defaults to the backend's default."
    required: false
    default: ""
  issue-url:
    description: "Issue/bug-report URL to reproduce. Defaults to the triggering issue."
    required: false
    default: ""
  execute:
    description: "Also run + verify the reproduction (not just static checks): true | false."
    required: false
    default: "false"
  reasoning-effort:
    description: "How hard to think: low | medium | high. Optional."
    required: false
    default: ""
  max-attempts:
    description: "Max generation attempts per run. Optional."
    required: false
    default: ""
  output:
    description: "Directory for RepGen results."
    required: false
    default: "repgen_results"
  comment:
    description: "Post the reproduction back as an issue comment: true | false."
    required: false
    default: "true"
  repgen-ref:
    description: >-
      pip target for RepGen (e.g. 'repgen-ai==0.2.0'). Defaults to installing
      from this action's own repo + ref.
    required: false
    default: ""
  github-token:
    description: "Token used to read the issue and post the comment."
    required: false
    default: ${{ github.token }}
  python-version:
    description: "Python version to run RepGen on."
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install RepGen
      shell: bash
      env:
        REPGEN_REF: ${{ inputs.repgen-ref }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_SHA: ${{ github.action_ref }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "$REPGEN_REF" ]; then
          pip install "$REPGEN_REF"
        else
          pip install "git+https://github.com/${ACTION_REPO}@${ACTION_SHA}"
        fi

    - name: Acknowledge the issue
      if: ${{ inputs.comment == 'true' && inputs.issue-url == '' && github.event.issue.number != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh issue comment "${{ github.event.issue.number }}" \
          --repo "${{ github.repository }}" \
          --body "🤖 **RepGen** picked up the issue and is generating a reproduction. Results will be posted here shortly." || true

    - name: Run RepGen
      id: repgen
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPGEN_BACKEND: ${{ inputs.backend }}
        REPGEN_MODEL: ${{ inputs.model }}
        ISSUE_URL: ${{ inputs.issue-url != '' && inputs.issue-url || github.event.issue.html_url }}
        EXECUTE: ${{ inputs.execute }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        OUTPUT_DIR: ${{ inputs.output }}
      run: |
        set +e
        ARGS=(run --yes --backend "$REPGEN_BACKEND" --bug-report "$ISSUE_URL" --repo . --output "$OUTPUT_DIR")
        [ -n "$REPGEN_MODEL" ]      && ARGS+=(--model "$REPGEN_MODEL")
        [ -n "$REASONING_EFFORT" ]  && ARGS+=(--reasoning-effort "$REASONING_EFFORT")
        [ -n "$MAX_ATTEMPTS" ]      && ARGS+=(--max-attempts "$MAX_ATTEMPTS")
        if [ "$EXECUTE" = "true" ]; then ARGS+=(--execute); else ARGS+=(--no-execute); fi
        repgen "${ARGS[@]}"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Post the reproduction as a comment
      if: ${{ always() && inputs.comment == 'true' && github.event.issue.number != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EXIT_CODE: ${{ steps.repgen.outputs.exit_code }}
        OUTPUT_DIR: ${{ inputs.output }}
      run: |
        set -e
        REPORT="$(find "$OUTPUT_DIR" -name report.md 2>/dev/null | sort | tail -n 1)"
        BODY_FILE="$(mktemp)"

        if [ "${EXIT_CODE:-1}" = "0" ]; then
          echo "### ✅ RepGen reproduction (static checks passed)" >> "$BODY_FILE"
        else
          echo "### ⚠️ RepGen reproduction (best effort)" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "Static verification did not fully pass — treat the script below as a starting point." >> "$BODY_FILE"
        fi
        echo "" >> "$BODY_FILE"

        if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
          head -c 60000 "$REPORT" >> "$BODY_FILE"
        else
          echo "RepGen did not produce a report — check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." >> "$BODY_FILE"
        fi
        echo "" >> "$BODY_FILE"
        echo "---" >> "$BODY_FILE"
        echo "_Generated by [RepGen](https://github.com/${{ github.action_repository }}) · [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_" >> "$BODY_FILE"

        gh issue comment "${{ github.event.issue.number }}" \
          --repo "${{ github.repository }}" \
          --body-file "$BODY_FILE"

        cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: repgen-results-${{ github.event.issue.number || github.run_id }}
        path: ${{ inputs.output }}/
        if-no-files-found: ignore
