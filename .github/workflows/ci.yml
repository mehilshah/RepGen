name: RepGen CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install (core + dev)
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Lint
      run: |
        flake8 repgen
        black --check repgen
        isort --check-only repgen

    - name: Test
      run: pytest -q

    - name: Build package
      run: python -m build

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        tags: repgen:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
